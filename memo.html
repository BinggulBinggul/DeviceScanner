<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal Memo - Green Onion Project</title>

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>

  <style>
    @view-transition {
      navigation: auto;
    }

    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      --transition-speed: 0.25s;
    }

    [data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at 20% 15%, #064e3b 0%, #06261f 35%, #030712 100%);
      --orb-1: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, transparent 70%);
      --orb-2: radial-gradient(circle, rgba(5, 150, 105, 0.2) 0%, transparent 70%);
      --orb-3: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
      
      --glass-bg: rgba(17, 24, 39, 0.72);
      --glass-card: rgba(17, 30, 27, 0.6);
      --glass-card-hover: rgba(22, 45, 39, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-focus: rgba(16, 185, 129, 0.6);

      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --accent-gradient: linear-gradient(135deg, #10b981, #059669);
      --danger: #ef4444;
      --warning: #f59e0b;

      --input-bg: rgba(15, 23, 42, 0.75);
      --modal-bg: rgba(15, 23, 42, 0.95);
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 20% 15%, #d1fae5 0%, #f0fdf4 40%, #f8fafc 100%);
      --orb-1: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, transparent 70%);
      --orb-2: radial-gradient(circle, rgba(52, 211, 153, 0.15) 0%, transparent 70%);
      --orb-3: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, transparent 70%);
      
      --glass-bg: rgba(255, 255, 255, 0.8);
      --glass-card: rgba(255, 255, 255, 0.72);
      --glass-card-hover: rgba(255, 255, 255, 0.95);
      --glass-border: rgba(16, 185, 129, 0.25);
      --glass-border-focus: rgba(16, 185, 129, 0.6);

      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --accent: #059669;
      --accent-glow: rgba(5, 150, 105, 0.25);
      --accent-gradient: linear-gradient(135deg, #059669, #047857);
      --danger: #dc2626;
      --warning: #d97706;

      --input-bg: rgba(255, 255, 255, 0.85);
      --modal-bg: rgba(255, 255, 255, 0.96);
      --shadow-color: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes pageEnterAnim {
      0% {
        opacity: 0;
        transform: scale(0.985) translateY(12px);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      user-select: none;
      display: flex;
      flex-direction: column;
      animation: pageEnterAnim 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: opacity 0.24s cubic-bezier(0.4, 0, 0.2, 1), transform 0.24s cubic-bezier(0.4, 0, 0.2, 1), filter 0.24s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.page-leaving {
      opacity: 0 !important;
      transform: scale(0.985) translateY(-8px) !important;
      filter: blur(6px) !important;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .orb-1 { width: 500px; height: 500px; top: -100px; left: -100px; background: var(--orb-1); }
    .orb-2 { width: 450px; height: 450px; bottom: -50px; right: -50px; background: var(--orb-2); }
    .orb-3 { width: 350px; height: 350px; top: 35%; left: 45%; background: var(--orb-3); }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 16px 20px 40px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 14px;
    }

    header.glass-header {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px var(--shadow-color);
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand-area { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .brand-title { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    .cloud-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn-icon {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-speed);
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-icon:hover {
      background: var(--glass-card-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .btn-dashboard {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399 !important;
      border-color: rgba(16, 185, 129, 0.35);
      gap: 6px;
    }
    .btn-dashboard:hover {
      background: rgba(16, 185, 129, 0.28);
      border-color: #10b981;
    }
    .btn-dashboard svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      vertical-align: middle;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    }
    .btn-primary {
      background: var(--accent-gradient);
      color: #fff !important;
      border: none;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    /* Toolbar */
    .memo-toolbar {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 24px var(--shadow-color);
      flex-wrap: wrap;
    }
    .search-filter-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 260px;
    }
    .memo-search {
      flex: 1;
      background: var(--input-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: 12px;
      padding: 9px 14px;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
      transition: all var(--transition-speed);
    }
    .memo-search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .filter-category {
      background: var(--input-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* Memo Grid */
    .memo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
      margin-top: 4px;
    }

    .memo-card {
      background: var(--glass-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 24px var(--shadow-color);
      transition: all var(--transition-speed);
      position: relative;
      cursor: pointer;
      user-select: text;
    }
    .memo-card:hover {
      background: var(--glass-card-hover);
      border-color: var(--glass-border-focus);
      transform: translateY(-3px);
      box-shadow: 0 14px 32px var(--accent-glow);
    }
    .memo-card.pinned {
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.05);
    }
    .memo-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }
    .memo-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.18);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .memo-pin-icon {
      font-size: 14px;
      color: var(--warning);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: transform 0.15s;
    }
    .memo-pin-icon:hover { transform: scale(1.2); }
    .memo-title {
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      word-break: break-word;
      line-height: 1.4;
    }
    .memo-content-preview {
      font-size: 13.5px;
      color: var(--text-sub);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 16px;
      flex: 1;
      max-height: 180px;
      overflow-y: hidden;
      position: relative;
    }
    .memo-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 12px;
      margin-top: auto;
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .memo-actions {
      display: flex;
      gap: 6px;
    }
    .btn-memo-act {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11.5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-memo-act:hover {
      background: var(--glass-card-hover);
      color: var(--text-main);
      border-color: var(--accent);
    }
    .btn-memo-act.del:hover {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border-color: var(--danger);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      background: var(--glass-card);
      border: 1px dashed var(--glass-border);
      border-radius: 20px;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      animation: modalFadeIn 0.2s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-size: 16.5px; font-weight: 700; }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 22px;
      cursor: pointer;
    }
    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; font-weight: 700; color: var(--text-sub); }
    .form-group input, .form-group select, .form-group textarea {
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
    }
    .form-group textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.6;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .char-counter { font-size: 11.5px; color: var(--text-muted); text-align: right; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px var(--shadow-color);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 2000;
    }
    .toast.success { border-left: 4px solid var(--accent); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.info { border-left: 4px solid var(--accent); }

    @media (max-width: 768px) {
      .app-container { padding: 12px 10px 40px; }
      header.glass-header { padding: 12px 14px; }
      .memo-grid { grid-template-columns: 1fr; }
      .search-filter-wrap { flex-direction: column; align-items: stretch; }
      .header-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .header-actions .btn-icon { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="glass-header">
      <div class="brand-area">
        <div class="brand-logo">📝</div>
        <div>
          <div class="brand-title">
            <span>개인 메모장</span>
            <span class="cloud-status" id="cloudStatus">☁️ 연결 확인 중</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <a href="./index.html" class="btn-icon btn-dashboard" title="Green Onion Project 메인 대시보드로 이동">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 11C10 7 7 4 4 3C5 7 8 9 10 12" fill="#a7f3d0"/>
            <path d="M12 10C13 6 16 3 20 2C18 6 15 8 13 11" fill="#6ee7b7"/>
            <path d="M11.5 10C11 6 12 3 13 1.5C13.8 4 13 7 12.5 10" fill="#a7f3d0"/>
            <path d="M10 11C9.5 14.5 9.5 18 10 20.5C10.1 21.3 12.9 21.3 13 20.5C13.5 18 13.5 14.5 13 11H10Z" fill="#ffffff"/>
            <path d="M9.8 14.5H13.2" stroke="#6ee7b7" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M10.5 21L9.5 23M11.5 21V23.5M12.5 21L13.5 23" stroke="#f1f5f9" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span>대시보드</span>
        </a>
        <button type="button" class="btn-icon" id="btnExportJson">💾 백업</button>
        <button type="button" class="btn-icon" id="btnThemeToggle">☀️ 테마</button>
        <button type="button" class="btn-icon btn-primary" id="btnOpenAddModal">＋ 새 메모</button>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="memo-toolbar">
      <div class="search-filter-wrap">
        <input type="text" class="memo-search" id="memoSearchInput" placeholder="메모 검색 (제목, 텍스트, 숫자)...">
        <select class="filter-category" id="filterCategory">
          <option value="ALL">전체 카테고리</option>
        </select>
      </div>
      <div style="font-size: 12.5px; color: var(--text-sub);" id="memoCountBadge">
        총 0개
      </div>
    </div>

    <!-- Memos Grid -->
    <div class="memo-grid" id="memoGrid"></div>
  </div>

  <!-- Modal: Add / Edit Memo -->
  <div class="modal-overlay" id="memoModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="memoModalTitle">새 메모 작성</div>
        <button type="button" class="modal-close" id="btnCloseMemoModal">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="formMemoId">
        <div class="form-group">
          <label>제목</label>
          <input type="text" id="formMemoTitle" placeholder="메모 제목 (선택 사항)">
        </div>
        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;">
            <label>카테고리</label>
            <input type="text" id="formMemoCategory" placeholder="예: 일반, 아이디어, 할 일" value="일반">
          </div>
          <div class="form-group" style="justify-content: flex-end;">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; padding-bottom: 8px;">
              <input type="checkbox" id="formMemoPinned" style="width: 16px; height: 16px; accent-color: var(--accent);">
              <span>상단 고정 📌</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>내용 (텍스트 / 숫자)</label>
          <textarea id="formMemoContent" placeholder="메모 내용을 자유롭게 입력하세요..."></textarea>
          <div class="char-counter" id="formCharCount">0자</div>
        </div>
      </div>
      <div class="modal-footer">
        <span style="font-size: 11px; color: var(--text-muted);" id="formMemoDateInfo"></span>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn-icon" id="btnCancelMemoModal">취소</button>
          <button type="button" class="btn-icon btn-primary" id="btnSaveMemo">저장 완료</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toastBox">
    <span id="toastMsg">알림</span>
  </div>

  <script>
    // 1. 메모장 상태 및 데이터 구조 (Firestore 'personal_memos' 컬렉션 사용)
    let memos = [];
    let categories = ["일반", "아이디어", "할 일", "중요", "기록"];

    // 2. Firebase Cloud Init
    let firestoreDb = null;
    let memoDocRef = null;

    function initFirebase() {
      try {
        if (typeof firebase !== 'undefined') {
          const firebaseConfig = {
            apiKey: "AIzaSyDX8rBeizluQ0bMkrOLUxEalkL7cMLqOtM",
            authDomain: "devicescannerk.firebaseapp.com",
            projectId: "devicescannerk",
            storageBucket: "devicescannerk.firebasestorage.app",
            messagingSenderId: "903936009990",
            appId: "1:903936009990:web:a154227c0349101c30a087"
          };

          const app = !firebase.apps.length ? firebase.initializeApp(firebaseConfig) : firebase.app();
          firestoreDb = app.firestore();
          // [핵심] 단말기 데이터와 완전히 분리된 전용 컬렉션 및 문서
          memoDocRef = firestoreDb.collection("personal_memos").doc("main_data");

          memoDocRef.onSnapshot((docSnap) => {
            if (docSnap.exists) {
              const data = docSnap.data();
              if (Array.isArray(data.memos)) memos = data.memos;
              if (Array.isArray(data.categories)) categories = data.categories;
              setCloudStatus(true);
              renderCategories();
              renderMemos();
            } else {
              saveToCloud();
            }
          }, (err) => {
            console.warn("Firestore 대기:", err);
            setCloudStatus(false);
          });
        }
      } catch (err) {
        console.warn("Firebase 초기화 에러:", err);
        setCloudStatus(false);
      }
    }

    async function saveToCloud() {
      const payload = {
        memos: memos,
        categories: categories,
        updatedAt: new Date().toISOString()
      };

      try {
        localStorage.setItem('personal_memos_cloud_cache', JSON.stringify(payload));
      } catch (e) {}

      if (memoDocRef) {
        try {
          await memoDocRef.set(payload);
          setCloudStatus(true);
        } catch (err) {
          console.warn("클라우드 저장 실패:", err);
          setCloudStatus(false);
        }
      }
      renderCategories();
    }

    function setCloudStatus(isOnline) {
      const status = document.getElementById('cloudStatus');
      if (!status) return;
      if (isOnline) {
        status.textContent = '☁️ 클라우드 동기화 완료';
        status.style.color = 'var(--accent)';
        status.style.borderColor = 'rgba(16, 185, 129, 0.4)';
      } else {
        status.textContent = '💾 로컬 캐시 모드';
        status.style.color = 'var(--warning)';
        status.style.borderColor = 'rgba(245, 158, 11, 0.4)';
      }
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toastBox');
      const text = document.getElementById('toastMsg');
      if (!box) return;
      box.className = `toast ${type}`;
      text.textContent = msg;
      box.style.display = 'flex';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.style.display = 'none';
      }, 2300);
    }

    // 3. 렌더링
    function renderCategories() {
      const select = document.getElementById('filterCategory');
      const curVal = select.value;
      
      const distinctCats = Array.from(new Set([...categories, ...memos.map(m => m.category).filter(Boolean)]));
      select.innerHTML = '<option value="ALL">전체 카테고리</option>';
      distinctCats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
      });
      select.value = distinctCats.includes(curVal) ? curVal : 'ALL';
    }

    function getFilteredMemos() {
      const query = document.getElementById('memoSearchInput').value.trim().toLowerCase();
      const filterCat = document.getElementById('filterCategory').value;

      return memos.filter(m => {
        if (filterCat !== 'ALL' && m.category !== filterCat) return false;
        if (!query) return true;
        return (
          (m.title || '').toLowerCase().includes(query) ||
          (m.content || '').toLowerCase().includes(query) ||
          (m.category || '').toLowerCase().includes(query)
        );
      }).sort((a, b) => {
        // 1순위: 고정된 메모 (pinned), 2순위: 최신 수정일순
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0);
      });
    }

    function renderMemos() {
      const grid = document.getElementById('memoGrid');
      grid.innerHTML = '';

      const filtered = getFilteredMemos();
      document.getElementById('memoCountBadge').textContent = `총 ${filtered.length}개`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 32px; margin-bottom: 10px;">📝</div>
            <div style="font-size: 15px; font-weight: 700; margin-bottom: 4px;">등록된 메모가 없습니다</div>
            <div style="font-size: 12.5px; color: var(--text-muted);">우측 상단의 [+ 새 메모] 버튼을 눌러 첫 번째 메모를 기록해 보세요.</div>
          </div>
        `;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = `memo-card ${m.pinned ? 'pinned' : ''}`;
        
        const dateDisplay = (m.updatedAt || m.createdAt || '').slice(0, 16);

        card.innerHTML = `
          <div class="memo-card-header">
            <span class="memo-badge">${m.category || '일반'}</span>
            <span class="memo-pin-icon" title="${m.pinned ? '고정 해제' : '상단 고정'}">${m.pinned ? '📌' : '📍'}</span>
          </div>
          <div class="memo-title">${m.title || '(제목 없음)'}</div>
          <div class="memo-content-preview">${m.content || '(내용 없음)'}</div>
          <div class="memo-footer">
            <span>${dateDisplay}</span>
            <div class="memo-actions">
              <button type="button" class="btn-memo-act btn-copy" title="내용 복사">복사</button>
              <button type="button" class="btn-memo-act btn-edit" title="수정">수정</button>
              <button type="button" class="btn-memo-act del btn-delete" title="삭제">삭제</button>
            </div>
          </div>
        `;

        // 카드 클릭 시 수정창 열기 (액션 버튼 제외)
        card.onclick = (e) => {
          if (e.target.closest('.memo-actions') || e.target.closest('.memo-pin-icon')) return;
          openEditModal(m);
        };

        // 핀 토글
        card.querySelector('.memo-pin-icon').onclick = (e) => {
          e.stopPropagation();
          m.pinned = !m.pinned;
          saveToCloud();
          renderMemos();
          showToast(m.pinned ? '상단에 고정되었습니다.' : '고정이 해제되었습니다.', 'info');
        };

        // 복사
        card.querySelector('.btn-copy').onclick = (e) => {
          e.stopPropagation();
          const copyText = `${m.title ? m.title + '\n\n' : ''}${m.content || ''}`;
          navigator.clipboard.writeText(copyText).then(() => {
            showToast('클립보드에 복사되었습니다.', 'success');
          }).catch(() => {
            showToast('복사 권한이 필요합니다.', 'error');
          });
        };

        // 수정
        card.querySelector('.btn-edit').onclick = (e) => {
          e.stopPropagation();
          openEditModal(m);
        };

        // 삭제
        card.querySelector('.btn-delete').onclick = (e) => {
          e.stopPropagation();
          if (confirm(`'${m.title || '선택한 메모'}'를 삭제하시겠습니까?`)) {
            memos = memos.filter(x => x.id !== m.id);
            saveToCloud();
            renderMemos();
            showToast('메모가 삭제되었습니다.', 'info');
          }
        };

        grid.appendChild(card);
      });
    }

    // 4. 모달 제어
    const memoModal = document.getElementById('memoModal');

    function openAddModal() {
      document.getElementById('memoModalTitle').textContent = '새 메모 작성';
      document.getElementById('formMemoId').value = '';
      document.getElementById('formMemoTitle').value = '';
      document.getElementById('formMemoCategory').value = '일반';
      document.getElementById('formMemoPinned').checked = false;
      document.getElementById('formMemoContent').value = '';
      document.getElementById('formCharCount').textContent = '0자';
      document.getElementById('formMemoDateInfo').textContent = '';
      memoModal.classList.add('active');
      setTimeout(() => document.getElementById('formMemoContent').focus(), 150);
    }

    function openEditModal(m) {
      document.getElementById('memoModalTitle').textContent = '메모 수정';
      document.getElementById('formDeviceId')?.remove();
      document.getElementById('formMemoId').value = m.id;
      document.getElementById('formMemoTitle').value = m.title || '';
      document.getElementById('formMemoCategory').value = m.category || '일반';
      document.getElementById('formMemoPinned').checked = !!m.pinned;
      document.getElementById('formMemoContent').value = m.content || '';
      document.getElementById('formCharCount').textContent = `${(m.content || '').length}자`;
      document.getElementById('formMemoDateInfo').textContent = `작성일: ${m.createdAt || '-'}`;
      memoModal.classList.add('active');
    }

    // 5. 초기화 및 이벤트 바인딩
    function initializeMemoApp() {
      const cached = localStorage.getItem('personal_memos_cloud_cache');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (parsed.memos) memos = parsed.memos;
          if (parsed.categories) categories = parsed.categories;
        } catch (e) {}
      }

      renderCategories();
      renderMemos();

      // 페이지 전환 트랜지션 (대시보드로 복귀 시 부드러운 애니메이션)
      document.querySelectorAll('a[href]').forEach(link => {
        link.addEventListener('click', function(e) {
          const targetUrl = this.getAttribute('href');
          if (!targetUrl || targetUrl.startsWith('#') || targetUrl.startsWith('javascript:') || this.getAttribute('target') === '_blank') return;
          
          e.preventDefault();
          document.body.classList.add('page-leaving');
          setTimeout(() => {
            window.location.href = targetUrl;
          }, 220);
        });
      });

      window.addEventListener('pageshow', (event) => {
        if (event.persisted) document.body.classList.remove('page-leaving');
      });

      // 테마 전환
      document.getElementById('btnThemeToggle').onclick = function() {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        this.textContent = next === 'dark' ? '☀️ 테마' : '🌙 테마';
      };

      document.getElementById('btnOpenAddModal').onclick = openAddModal;
      document.getElementById('btnCloseMemoModal').onclick = () => memoModal.classList.remove('active');
      document.getElementById('btnCancelMemoModal').onclick = () => memoModal.classList.remove('active');

      // 글자수 카운터
      document.getElementById('formMemoContent').addEventListener('input', function() {
        document.getElementById('formCharCount').textContent = `${this.value.length}자`;
      });

      // 메모 저장 버튼
      document.getElementById('btnSaveMemo').onclick = async function() {
        const id = document.getElementById('formMemoId').value;
        const title = document.getElementById('formMemoTitle').value.trim();
        const category = document.getElementById('formMemoCategory').value.trim() || '일반';
        const pinned = document.getElementById('formMemoPinned').checked;
        const content = document.getElementById('formMemoContent').value;

        if (!title && !content) {
          showToast('제목 또는 내용을 입력하세요.', 'error');
          return;
        }

        const nowStr = new Date().toISOString().replace('T', ' ').slice(0, 19);

        if (id) {
          const idx = memos.findIndex(x => x.id === id);
          if (idx !== -1) {
            memos[idx] = {
              ...memos[idx],
              title,
              category,
              pinned,
              content,
              updatedAt: nowStr
            };
          }
        } else {
          const newMemo = {
            id: 'memo-' + Date.now(),
            title,
            category,
            pinned,
            content,
            createdAt: nowStr,
            updatedAt: nowStr
          };
          memos.unshift(newMemo);
        }

        if (!categories.includes(category)) {
          categories.push(category);
        }

        await saveToCloud();
        renderMemos();
        memoModal.classList.remove('active');
        showToast('메모가 저장되었습니다.', 'success');
      };

      // 검색 & 필터
      document.getElementById('memoSearchInput').addEventListener('input', renderMemos);
      document.getElementById('filterCategory').addEventListener('change', renderMemos);

      // JSON 백업 다운로드
      document.getElementById('btnExportJson').onclick = function() {
        const exportData = { memos, categories, exportedAt: new Date().toISOString() };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `memos_backup_${Date.now()}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
        showToast('메모 JSON 백업 파일이 다운로드되었습니다.', 'success');
      };

      initFirebase();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeMemoApp);
    } else {
      initializeMemoApp();
    }
  </script>
</body>
</html>
