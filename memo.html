<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Personal Memo - Green Onion Project</title>

  <link rel="manifest" href="./manifest.json">
  <!-- 안드로이드 시스템 상태바 및 하단 제스처 바 색상 동기화 메타 태그 -->
  <meta name="theme-color" content="#030712" id="themeMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>

  <style>
    @view-transition { navigation: auto; }

    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      --transition-speed: 0.25s;
    }

    [data-theme="dark"] {
      --bg-base: #030712;
      --bg-gradient: radial-gradient(circle at 20% 15%, #064e3b 0%, #06261f 35%, #030712 100%);
      --orb-1: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, transparent 70%);
      --orb-2: radial-gradient(circle, rgba(5, 150, 105, 0.2) 0%, transparent 70%);
      --orb-3: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
      
      --glass-bg: rgba(17, 24, 39, 0.72);
      --glass-card: rgba(17, 30, 27, 0.6);
      --glass-card-hover: rgba(22, 45, 39, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-border-focus: rgba(16, 185, 129, 0.6);

      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --accent-gradient: linear-gradient(135deg, #10b981, #059669);
      --danger: #ef4444;
      --warning: #f59e0b;

      --input-bg: rgba(15, 23, 42, 0.75);
      --modal-bg: rgba(15, 23, 42, 0.95);
      --shadow-color: rgba(0, 0, 0, 0.5);

      --dock-bg: rgba(15, 23, 42, 0.88);
      --dock-border: rgba(255, 255, 255, 0.15);
      --dock-item-hover: rgba(255, 255, 255, 0.08);
    }

    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-gradient: radial-gradient(circle at 20% 15%, #d1fae5 0%, #f0fdf4 40%, #f8fafc 100%);
      --orb-1: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, transparent 70%);
      --orb-2: radial-gradient(circle, rgba(52, 211, 153, 0.15) 0%, transparent 70%);
      --orb-3: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, transparent 70%);
      
      --glass-bg: rgba(255, 255, 255, 0.8);
      --glass-card: rgba(255, 255, 255, 0.72);
      --glass-card-hover: rgba(255, 255, 255, 0.95);
      --glass-border: rgba(16, 185, 129, 0.25);
      --glass-border-focus: rgba(16, 185, 129, 0.6);

      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --accent: #059669;
      --accent-glow: rgba(5, 150, 105, 0.25);
      --accent-gradient: linear-gradient(135deg, #059669, #047857);
      --danger: #dc2626;
      --warning: #d97706;

      --input-bg: rgba(255, 255, 255, 0.85);
      --modal-bg: rgba(255, 255, 255, 0.96);
      --shadow-color: rgba(0, 0, 0, 0.08);

      --dock-bg: rgba(255, 255, 255, 0.92);
      --dock-border: rgba(255, 255, 255, 0.95);
      --dock-item-hover: rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* [핵심 1] 최상단 html/body 배경색 강제 밀착 (하단 틈새 색상 불일치 완전 차단) */
    html {
      background-color: #030712;
      min-height: 100%;
      min-height: 100dvh;
    }
    html[data-theme="light"] {
      background-color: #f8fafc;
    }

    body {
      font-family: var(--font-family);
      background-color: transparent;
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
      user-select: none;
      display: flex;
      flex-direction: column;
      animation: pageEnterAnim 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: opacity 0.24s cubic-bezier(0.4, 0, 0.2, 1), transform 0.24s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.page-leaving {
      opacity: 0 !important;
      transform: scale(0.985) translateY(-8px) !important;
      pointer-events: none;
    }

    /* [핵심 2] 화면 전체를 100dvh로 빈틈없이 감싸는 고정 배경 레이어 */
    .app-bg-fixed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: var(--bg-gradient);
      z-index: -10;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: -5;
    }
    .orb-1 { width: 500px; height: 500px; top: -100px; left: -100px; background: var(--orb-1); }
    .orb-2 { width: 450px; height: 450px; bottom: -50px; right: -50px; background: var(--orb-2); }
    .orb-3 { width: 350px; height: 350px; top: 35%; left: 45%; background: var(--orb-3); }

    /* [핵심 3] 상단 펀치홀 0px 밀착 및 하단 플로팅 독 겹침 방지 여백 */
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 10px 16px calc(110px + env(safe-area-inset-bottom, 0px)) 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
      min-width: 0;
    }

    header.glass-header {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px var(--shadow-color);
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand-area { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .brand-title { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    .cloud-status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 하단 플로팅 독 */
    .floating-dock-wrap {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 96vw;
      pointer-events: none;
    }

    .floating-pill-bar {
      pointer-events: auto;
      background: var(--dock-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1.5px solid var(--dock-border);
      border-radius: 9999px;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      gap: 3px;
      box-shadow: 0 16px 40px var(--shadow-color), 0 0 24px rgba(16, 185, 129, 0.15);
    }

    .pill-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 9999px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
      min-width: 48px;
    }
    .pill-item:hover {
      background: var(--dock-item-hover);
      color: var(--text-main);
      transform: translateY(-2px);
    }
    .pill-item:active { transform: scale(0.94); }

    .pill-icon {
      font-size: 16px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pill-icon svg {
      width: 18px;
      height: 18px;
      vertical-align: middle;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    }
    .pill-label {
      font-size: 9.5px;
      font-weight: 700;
      margin-top: 2px;
      white-space: nowrap;
      letter-spacing: -0.2px;
    }

    /* 1. 대시보드 (초록) */
    .pill-item.pill-accent-dash {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff !important;
      padding: 6px 13px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
    .pill-item.pill-accent-dash .pill-label { color: #fff; }

    /* 2. 새 메모 (보라) */
    .pill-item.pill-primary {
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: #fff !important;
      padding: 6px 13px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .pill-item.pill-primary .pill-label { color: #fff; }

    /* 독립 분리된 원형 테마 버튼 */
    .floating-theme-island {
      pointer-events: auto;
      background: var(--dock-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1.5px solid var(--dock-border);
      border-radius: 9999px;
      width: 48px;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      box-shadow: 0 16px 40px var(--shadow-color), 0 0 20px rgba(16, 185, 129, 0.15);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0;
      flex-shrink: 0;
    }
    .floating-theme-island:hover {
      background: var(--dock-item-hover);
      transform: translateY(-2px) scale(1.06);
      border-color: var(--accent);
    }
    .floating-theme-island:active { transform: scale(0.92); }
    .floating-theme-island .pill-icon { font-size: 16px; height: 18px; }
    .floating-theme-island .pill-label { font-size: 9px; font-weight: 700; color: var(--text-sub); }

    /* 툴바 */
    .memo-toolbar {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 8px 24px var(--shadow-color);
      flex-wrap: wrap;
      min-width: 0;
    }
    .search-filter-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 220px;
    }
    .memo-search {
      flex: 1;
      background: var(--input-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
      transition: all var(--transition-speed);
      min-width: 0;
    }
    .memo-search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .filter-category {
      background: var(--input-bg);
      border: 1.5px solid var(--glass-border);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 12.5px;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    /* 메모 카드 그리드 */
    .memo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
      margin-top: 2px;
      min-width: 0;
      width: 100%;
    }

    .memo-card {
      background: var(--glass-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 24px var(--shadow-color);
      transition: all var(--transition-speed);
      position: relative;
      cursor: pointer;
      user-select: text;
      min-width: 0;
    }
    .memo-card:hover {
      background: var(--glass-card-hover);
      border-color: var(--glass-border-focus);
      transform: translateY(-3px);
      box-shadow: 0 14px 32px var(--accent-glow);
    }
    .memo-card.pinned {
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.05);
    }
    .memo-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }
    .memo-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2.5px 7.5px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.18);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .memo-pin-icon {
      font-size: 14px;
      color: var(--warning);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: transform 0.15s;
    }
    .memo-pin-icon:hover { transform: scale(1.2); }
    .memo-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      word-break: break-word;
      line-height: 1.4;
    }
    .memo-content-preview {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 14px;
      flex: 1;
      max-height: 180px;
      overflow-y: hidden;
      position: relative;
    }
    .memo-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
      margin-top: auto;
      font-size: 11px;
      color: var(--text-muted);
    }
    .memo-actions { display: flex; gap: 5px; }
    .btn-memo-act {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      border-radius: 6px;
      padding: 3.5px 7.5px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-memo-act:hover {
      background: var(--glass-card-hover);
      color: var(--text-main);
      border-color: var(--accent);
    }
    .btn-memo-act.del:hover {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border-color: var(--danger);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: var(--text-sub);
      background: var(--glass-card);
      border: 1px dashed var(--glass-border);
      border-radius: 20px;
    }

    /* 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--modal-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      animation: pageEnterAnim 0.2s ease-out;
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-size: 16.5px; font-weight: 700; }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 22px;
      cursor: pointer;
    }
    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; font-weight: 700; color: var(--text-sub); }
    .form-group input, .form-group select, .form-group textarea {
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13.5px;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
    }
    .form-group textarea {
      min-height: 200px;
      resize: vertical;
      line-height: 1.6;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .char-counter { font-size: 11px; color: var(--text-muted); text-align: right; }

    .changelog-container-split {
      display: flex;
      gap: 16px;
      min-height: 300px;
    }
    .changelog-sidebar {
      width: 170px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-right: 1px solid var(--glass-border);
      padding-right: 12px;
    }
    .changelog-tab-btn {
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
      transition: all var(--transition-speed);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .changelog-tab-btn:hover { background: var(--glass-card-hover); color: var(--text-main); }
    .changelog-tab-btn.active {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--accent);
      color: var(--text-main);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .changelog-tab-btn .tab-date { font-size: 10px; color: var(--text-muted); font-weight: 400; }
    .changelog-tab-btn.active .tab-date { color: #cbd5e1; }
    .changelog-detail-pane {
      flex: 1;
      padding-left: 4px;
      overflow-y: auto;
    }
    .changelog-detail-header {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--glass-border);
    }
    .changelog-detail-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 4px;
      color: var(--text-main);
    }
    .changelog-detail-date { font-size: 12px; color: var(--text-sub); }
    .changelog-detail-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .changelog-detail-item {
      font-size: 13px;
      line-height: 1.6;
      color: #e2e8f0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .changelog-detail-item::before {
      content: '✓';
      color: var(--accent);
      font-weight: 800;
      margin-top: 1px;
    }

    .about-card-hero {
      text-align: center;
      padding: 10px 0 16px;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 16px;
    }
    .about-app-logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 10px;
      border-radius: 14px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 26px;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .about-version-badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 6px;
    }
    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .spec-item {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 9px 12px;
    }
    .spec-lbl { font-size: 11px; color: var(--text-sub); margin-bottom: 2px; }
    .spec-val { font-size: 13px; font-weight: 600; word-break: break-all; }

    .btn-icon {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-speed);
      white-space: nowrap;
    }
    .btn-icon:hover {
      background: var(--glass-card-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .btn-icon.btn-primary {
      background: var(--accent-gradient);
      color: #fff !important;
      border: none;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .toast {
      position: fixed;
      bottom: 84px;
      right: 24px;
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px var(--shadow-color);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 3000;
    }
    .toast.success { border-left: 4px solid var(--accent); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.info { border-left: 4px solid var(--accent); }

    /* 태블릿(1024px) 및 모바일 완벽 대응 */
    @media (max-width: 1024px) {
      .app-container {
        padding: 8px 10px calc(110px + env(safe-area-inset-bottom, 0px)) 10px;
      }
      header.glass-header { padding: 10px 14px; }
      .memo-grid { grid-template-columns: 1fr; gap: 10px; }
      .search-filter-wrap { flex-direction: column; align-items: stretch; }
      .floating-dock-wrap { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); gap: 6px; max-width: 98vw; }
      .floating-pill-bar { padding: 4px 6px; gap: 2px; }
      .pill-item { padding: 5px 6px; min-width: 40px; }
      .pill-icon { font-size: 15px; height: 18px; }
      .pill-icon svg { width: 16px; height: 16px; }
      .pill-label { font-size: 9px; }
      .pill-item.pill-accent-dash, .pill-item.pill-primary { padding: 5px 9px; }
      .floating-theme-island { width: 40px; height: 40px; }
      .floating-theme-island .pill-icon { font-size: 14px; height: 16px; }
      .floating-theme-island .pill-label { font-size: 8px; }
      .changelog-container-split { flex-direction: column; }
      .changelog-sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--glass-border);
        padding-right: 0;
        padding-bottom: 10px;
        flex-direction: row;
        overflow-x: auto;
      }
      .changelog-tab-btn { flex-shrink: 0; }
      .specs-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <!-- [핵심] 화면 100%를 오차 없이 덮는 고정 배경 레이어 -->
  <div class="app-bg-fixed"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="app-container">
    <header class="glass-header">
      <div class="brand-area">
        <div class="brand-logo">📝</div>
        <div>
          <div class="brand-title">
            <span>개인 메모장</span>
            <span class="cloud-status" id="cloudStatus">☁️ 연결 확인 중</span>
          </div>
        </div>
      </div>
    </header>

    <div class="memo-toolbar">
      <div class="search-filter-wrap">
        <input type="text" class="memo-search" id="memoSearchInput" placeholder="메모 검색 (제목, 텍스트, 숫자)...">
        <select class="filter-category" id="filterCategory">
          <option value="ALL">전체 카테고리</option>
        </select>
      </div>
      <div style="font-size: 12.5px; color: var(--text-sub);" id="memoCountBadge">총 0개</div>
    </div>

    <div class="memo-grid" id="memoGrid"></div>
  </div>

  <!-- 하단 플로팅 독 -->
  <div class="floating-dock-wrap">
    <nav class="floating-pill-bar">
      <!-- 1. 대시보드 (초록 강조) -->
      <a href="./index.html" class="pill-item pill-accent-dash" title="메인 대시보드로 이동">
        <div class="pill-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 11C10 7 7 4 4 3C5 7 8 9 10 12" fill="#a7f3d0"/>
            <path d="M12 10C13 6 16 3 20 2C18 6 15 8 13 11" fill="#6ee7b7"/>
            <path d="M11.5 10C11 6 12 3 13 1.5C13.8 4 13 7 12.5 10" fill="#a7f3d0"/>
            <path d="M10 11C9.5 14.5 9.5 18 10 20.5C10.1 21.3 12.9 21.3 13 20.5C13.5 18 13.5 14.5 13 11H10Z" fill="#ffffff"/>
            <path d="M9.8 14.5H13.2" stroke="#6ee7b7" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M10.5 21L9.5 23M11.5 21V23.5M12.5 21L13.5 23" stroke="#f1f5f9" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="pill-label">대시보드</span>
      </a>

      <!-- 2. 새 메모 (보라 강조) -->
      <button type="button" class="pill-item pill-primary" id="btnOpenAddModal" title="새 메모 작성">
        <div class="pill-icon">＋</div>
        <span class="pill-label">새 메모</span>
      </button>

      <!-- 3. 로그 -->
      <button type="button" class="pill-item" id="btnOpenChangelogModal" title="업데이트 로그">
        <div class="pill-icon">📋</div>
        <span class="pill-label">로그</span>
      </button>

      <!-- 4. 정보 -->
      <button type="button" class="pill-item" id="btnOpenAboutModal" title="앱 정보">
        <div class="pill-icon">ℹ️</div>
        <span class="pill-label">정보</span>
      </button>

      <!-- 5. 백업 -->
      <button type="button" class="pill-item" id="btnExportJson" title="JSON 백업">
        <div class="pill-icon">💾</div>
        <span class="pill-label">백업</span>
      </button>
    </nav>

    <!-- 6. 독립 분리된 원형 테마 버튼 -->
    <button type="button" class="floating-theme-island" id="btnThemeToggle" title="테마 전환">
      <div class="pill-icon" id="themePillIcon">☀️</div>
      <span class="pill-label" id="themePillLabel">테마</span>
    </button>
  </div>

  <!-- 모달들 -->
  <div class="modal-overlay" id="memoModal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="memoModalTitle">새 메모 작성</div>
        <button type="button" class="modal-close" id="btnCloseMemoModal">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="formMemoId">
        <div class="form-group"><label>제목</label><input type="text" id="formMemoTitle" placeholder="메모 제목 (선택 사항)"></div>
        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;"><label>카테고리</label><input type="text" id="formMemoCategory" value="일반"></div>
          <div class="form-group" style="justify-content: flex-end;">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; padding-bottom: 8px;">
              <input type="checkbox" id="formMemoPinned" style="width: 16px; height: 16px; accent-color: var(--accent);"> <span>상단 고정 📌</span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>내용 (텍스트 / 숫자)</label>
          <textarea id="formMemoContent" placeholder="메모 내용을 자유롭게 입력하세요..."></textarea>
          <div class="char-counter" id="formCharCount">0자</div>
        </div>
      </div>
      <div class="modal-footer">
        <span style="font-size: 11px; color: var(--text-muted);" id="formMemoDateInfo"></span>
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn-icon" id="btnCancelMemoModal">취소</button>
          <button type="button" class="btn-icon btn-primary" id="btnSaveMemo">저장 완료</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="changelogModal">
    <div class="modal-box" style="max-width: 640px;">
      <div class="modal-header">
        <div class="modal-title">📋 업데이트 로그</div>
        <button type="button" class="modal-close" id="btnCloseChangelogModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="changelog-container-split">
          <div class="changelog-sidebar" id="changelogSidebar"></div>
          <div class="changelog-detail-pane" id="changelogDetailPane"></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-icon btn-primary" id="btnDoneChangelogModal">닫기</button></div>
    </div>
  </div>

  <div class="modal-overlay" id="aboutModal">
    <div class="modal-box" style="max-width: 500px;">
      <div class="modal-header">
        <div class="modal-title">ℹ️ 애플리케이션 정보</div>
        <button type="button" class="modal-close" id="btnCloseAboutModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="about-card-hero">
          <div class="about-app-logo">📝</div>
          <h2 style="font-size: 18px; font-weight: 800;" id="aboutAppTitle">Personal Memo Hub</h2>
          <div class="about-version-badge" id="aboutAppVersion">v1.1</div>
        </div>
        <div class="specs-grid">
          <div class="spec-item"><div class="spec-lbl">프로젝트</div><div class="spec-val">Green Onion Project</div></div>
          <div class="spec-item"><div class="spec-lbl">개발자</div><div class="spec-val" id="aboutDevName">Kim Dogyun</div></div>
          <div class="spec-item"><div class="spec-lbl">배포 환경</div><div class="spec-val">Vercel Web + GitHub</div></div>
          <div class="spec-item"><div class="spec-lbl">클라우드</div><div class="spec-val">Firebase Firestore</div></div>
          <div class="spec-item"><div class="spec-lbl">사용 AI</div><div class="spec-val">Gemini</div></div>
          <div class="spec-item"><div class="spec-lbl">빌드 날짜</div><div class="spec-val">2026-09-22</div></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn-icon btn-primary" id="btnDoneAboutModal">확인</button></div>
    </div>
  </div>

  <div class="toast" id="toastBox"><span id="toastMsg">알림</span></div>

  <script>
    const APP_INFO = {
      title: "Personal Memo Hub",
      version: "v1.1",
      developer: "Kim Dogyun",
      deployEnv: "Vercel Web + GitHub",
      cloud: "Firebase Firestore",
      ai: "Gemini",
      releaseDate: "2026-09-22",
      changelog: [
        {
          version: "v1.1",
          date: "2026.09.22",
          notes: [
            "하단 배경 틈새 색상 일체화 및 시스템 바 색상 동기화",
            "플로팅 독 디자인 적용 및 태블릿 반응형 레이아웃 대응",
            "펀치홀 카메라 상단 0px 전체화면 밀착 지원"
          ]
        },
        {
          version: "v1.0 정식출시",
          date: "2026.09.22",
          notes: [
            "Green Onion Project 대시보드 연동",
            "하단 리퀴드 글래스 플로팅 독 & 독립 테마 아일랜드 UI 적용",
            "텍스트 및 숫자 기반 빠른 기록 & 클라우드 실시간 동기화 지원"
          ]
        }
      ]
    };

    let memos = [];
    let categories = ["일반", "아이디어", "할 일", "중요", "기록"];
    let currentChangelogIndex = 0;
    let firestoreDb = null;
    let memoDocRef = null;

    function initFirebase() {
      try {
        if (typeof firebase !== 'undefined') {
          const firebaseConfig = {
            apiKey: "AIzaSyDX8rBeizluQ0bMkrOLUxEalkL7cMLqOtM",
            authDomain: "devicescannerk.firebaseapp.com",
            projectId: "devicescannerk",
            storageBucket: "devicescannerk.firebasestorage.app",
            messagingSenderId: "903936009990",
            appId: "1:903936009990:web:a154227c0349101c30a087"
          };
          const app = !firebase.apps.length ? firebase.initializeApp(firebaseConfig) : firebase.app();
          firestoreDb = app.firestore();
          memoDocRef = firestoreDb.collection("personal_memos").doc("main_data");

          memoDocRef.onSnapshot((docSnap) => {
            if (docSnap.exists) {
              const data = docSnap.data();
              if (Array.isArray(data.memos)) memos = data.memos;
              if (Array.isArray(data.categories)) categories = data.categories;
              setCloudStatus(true); renderCategories(); renderMemos();
            } else { saveToCloud(); }
          }, (err) => { setCloudStatus(false); });
        }
      } catch (err) { setCloudStatus(false); }
    }

    async function saveToCloud() {
      const payload = { memos, categories, updatedAt: new Date().toISOString() };
      try { localStorage.setItem('personal_memos_cloud_cache', JSON.stringify(payload)); } catch (e) {}
      if (memoDocRef) { try { await memoDocRef.set(payload); setCloudStatus(true); } catch(e){ setCloudStatus(false); } }
      renderCategories();
    }

    function setCloudStatus(isOnline) {
      const status = document.getElementById('cloudStatus');
      if (!status) return;
      if (isOnline) {
        status.textContent = '☁️ 클라우드 동기화 완료';
        status.style.color = 'var(--accent)';
        status.style.borderColor = 'rgba(16, 185, 129, 0.4)';
      } else {
        status.textContent = '💾 로컬 캐시 모드';
        status.style.color = 'var(--warning)';
        status.style.borderColor = 'rgba(245, 158, 11, 0.4)';
      }
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toastBox');
      const text = document.getElementById('toastMsg');
      if (!box) return;
      box.className = `toast ${type}`; text.textContent = msg; box.style.display = 'flex';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { box.style.display = 'none'; }, 2300);
    }

    function renderCategories() {
      const select = document.getElementById('filterCategory');
      const curVal = select.value;
      const distinctCats = Array.from(new Set([...categories, ...memos.map(m => m.category).filter(Boolean)]));
      select.innerHTML = '<option value="ALL">전체 카테고리</option>';
      distinctCats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c; select.appendChild(opt);
      });
      select.value = distinctCats.includes(curVal) ? curVal : 'ALL';
    }

    function getFilteredMemos() {
      const query = document.getElementById('memoSearchInput').value.trim().toLowerCase();
      const filterCat = document.getElementById('filterCategory').value;
      return memos.filter(m => {
        if (filterCat !== 'ALL' && m.category !== filterCat) return false;
        if (!query) return true;
        return (
          (m.title || '').toLowerCase().includes(query) ||
          (m.content || '').toLowerCase().includes(query) ||
          (m.category || '').toLowerCase().includes(query)
        );
      }).sort((a, b) => {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0);
      });
    }

    function renderMemos() {
      const grid = document.getElementById('memoGrid');
      grid.innerHTML = '';
      const filtered = getFilteredMemos();
      document.getElementById('memoCountBadge').textContent = `총 ${filtered.length}개`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div style="font-size: 32px; margin-bottom: 10px;">📝</div><div style="font-size: 15px; font-weight: 700; margin-bottom: 4px;">등록된 메모가 없습니다</div><div style="font-size: 12.5px; color: var(--text-muted);">하단 독의 [+ 새 메모] 버튼을 눌러 기록해 보세요.</div></div>`;
        return;
      }

      filtered.forEach(m => {
        const card = document.createElement('div');
        card.className = `memo-card ${m.pinned ? 'pinned' : ''}`;
        const dateDisplay = (m.updatedAt || m.createdAt || '').slice(0, 16);

        card.innerHTML = `
          <div class="memo-card-header"><span class="memo-badge">${m.category || '일반'}</span><span class="memo-pin-icon" title="${m.pinned ? '고정 해제' : '상단 고정'}">${m.pinned ? '📌' : '📍'}</span></div>
          <div class="memo-title">${m.title || '(제목 없음)'}</div>
          <div class="memo-content-preview">${m.content || '(내용 없음)'}</div>
          <div class="memo-footer">
            <span>${dateDisplay}</span>
            <div class="memo-actions">
              <button type="button" class="btn-memo-act btn-copy">복사</button>
              <button type="button" class="btn-memo-act btn-edit">수정</button>
              <button type="button" class="btn-memo-act del btn-delete">삭제</button>
            </div>
          </div>
        `;

        card.onclick = (e) => { if (!e.target.closest('.memo-actions') && !e.target.closest('.memo-pin-icon')) openEditModal(m); };
        card.querySelector('.memo-pin-icon').onclick = (e) => { e.stopPropagation(); m.pinned = !m.pinned; saveToCloud(); renderMemos(); showToast(m.pinned ? '고정됨' : '고정 해제됨', 'info'); };
        card.querySelector('.btn-copy').onclick = (e) => {
          e.stopPropagation();
          navigator.clipboard.writeText(`${m.title ? m.title + '\n\n' : ''}${m.content || ''}`).then(() => showToast('복사 완료', 'success'));
        };
        card.querySelector('.btn-edit').onclick = (e) => { e.stopPropagation(); openEditModal(m); };
        card.querySelector('.btn-delete').onclick = (e) => {
          e.stopPropagation();
          if (confirm('삭제하시겠습니까?')) { memos = memos.filter(x => x.id !== m.id); saveToCloud(); renderMemos(); showToast('삭제되었습니다.', 'info'); }
        };

        grid.appendChild(card);
      });
    }

    const memoModal = document.getElementById('memoModal');
    const aboutModal = document.getElementById('aboutModal');
    const changelogModal = document.getElementById('changelogModal');

    function openAddModal() {
      document.getElementById('memoModalTitle').textContent = '새 메모 작성';
      document.getElementById('formMemoId').value = '';
      document.getElementById('formMemoTitle').value = '';
      document.getElementById('formMemoCategory').value = '일반';
      document.getElementById('formMemoPinned').checked = false;
      document.getElementById('formMemoContent').value = '';
      document.getElementById('formCharCount').textContent = '0자';
      document.getElementById('formMemoDateInfo').textContent = '';
      memoModal.classList.add('active');
    }

    function openEditModal(m) {
      document.getElementById('memoModalTitle').textContent = '메모 수정';
      document.getElementById('formMemoId').value = m.id;
      document.getElementById('formMemoTitle').value = m.title || '';
      document.getElementById('formMemoCategory').value = m.category || '일반';
      document.getElementById('formMemoPinned').checked = !!m.pinned;
      document.getElementById('formMemoContent').value = m.content || '';
      document.getElementById('formCharCount').textContent = `${(m.content || '').length}자`;
      document.getElementById('formMemoDateInfo').textContent = `작성: ${m.createdAt || '-'}`;
      memoModal.classList.add('active');
    }

    function renderAboutModal() {
      document.getElementById('aboutAppTitle').textContent = APP_INFO.title;
      document.getElementById('aboutAppVersion').textContent = APP_INFO.version;
      document.getElementById('aboutDevName').textContent = APP_INFO.developer;
      document.getElementById('aboutDeployEnv').textContent = APP_INFO.deployEnv;
      document.getElementById('aboutCloudDb').textContent = APP_INFO.cloud;
      document.getElementById('aboutAi').textContent = APP_INFO.ai;
      document.getElementById('aboutAppDate').textContent = APP_INFO.releaseDate;
    }

    function renderChangelogModal(activeIndex = 0) {
      currentChangelogIndex = activeIndex;
      const sidebar = document.getElementById('changelogSidebar');
      const detailPane = document.getElementById('changelogDetailPane');
      sidebar.innerHTML = '';
      APP_INFO.changelog.forEach((item, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `changelog-tab-btn ${idx === currentChangelogIndex ? 'active' : ''}`;
        btn.innerHTML = `<span>${item.version}</span><span class="tab-date">${item.date}</span>`;
        btn.onclick = () => renderChangelogModal(idx);
        sidebar.appendChild(btn);
      });
      const selected = APP_INFO.changelog[currentChangelogIndex];
      if (selected) {
        detailPane.innerHTML = `<div class="changelog-detail-header"><div class="changelog-detail-title">${selected.version}</div><div class="changelog-detail-date">📅 배포일: ${selected.date}</div></div><ul class="changelog-detail-list">${selected.notes.map(n => `<li class="changelog-detail-item">${n}</li>`).join('')}</ul>`;
      }
    }

    function initializeMemoApp() {
      const cached = localStorage.getItem('personal_memos_cloud_cache');
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (parsed.memos) memos = parsed.memos;
          if (parsed.categories) categories = parsed.categories;
        } catch (e) {}
      }

      renderCategories(); renderMemos();

      document.querySelectorAll('a[href]').forEach(link => {
        link.addEventListener('click', function(e) {
          const targetUrl = this.getAttribute('href');
          if (!targetUrl || targetUrl.startsWith('#') || targetUrl.startsWith('javascript:')) return;
          e.preventDefault(); document.body.classList.add('page-leaving');
          setTimeout(() => { window.location.href = targetUrl; }, 220);
        });
      });

      window.addEventListener('pageshow', (event) => { if (event.persisted) document.body.classList.remove('page-leaving'); });

      // [핵심 4] 테마 전환 시 안드로이드 시스템 상태바 & 네비게이션 바 메타 태그 동시 갱신
      document.getElementById('btnThemeToggle').onclick = function() {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        document.getElementById('themePillIcon').textContent = next === 'dark' ? '☀️' : '🌙';

        const targetColor = next === 'dark' ? '#030712' : '#f8fafc';
        const meta = document.getElementById('themeMeta');
        if (meta) meta.setAttribute('content', targetColor);
      };

      document.getElementById('btnOpenAddModal').onclick = openAddModal;
      document.getElementById('btnOpenChangelogModal').onclick = () => { renderChangelogModal(0); changelogModal.classList.add('active'); };
      document.getElementById('btnCloseChangelogModal').onclick = () => changelogModal.classList.remove('active');
      document.getElementById('btnDoneChangelogModal').onclick = () => changelogModal.classList.remove('active');

      document.getElementById('btnOpenAboutModal').onclick = () => { renderAboutModal(); aboutModal.classList.add('active'); };
      document.getElementById('btnCloseAboutModal').onclick = () => aboutModal.classList.remove('active');
      document.getElementById('btnDoneAboutModal').onclick = () => aboutModal.classList.remove('active');

      document.getElementById('btnExportJson').onclick = function() {
        const exportData = { memos, categories, exportedAt: new Date().toISOString() };
        const dlAnchor = document.createElement('a');
        dlAnchor.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
        dlAnchor.download = `memos_backup_${Date.now()}.json`;
        document.body.appendChild(dlAnchor); dlAnchor.click(); dlAnchor.remove();
        showToast('메모 백업 파일 다운로드 완료', 'success');
      };

      document.getElementById('btnCloseMemoModal').onclick = () => memoModal.classList.remove('active');
      document.getElementById('btnCancelMemoModal').onclick = () => memoModal.classList.remove('active');

      document.getElementById('formMemoContent').addEventListener('input', function() {
        document.getElementById('formCharCount').textContent = `${this.value.length}자`;
      });

      document.getElementById('btnSaveMemo').onclick = async function() {
        const id = document.getElementById('formMemoId').value;
        const title = document.getElementById('formMemoTitle').value.trim();
        const category = document.getElementById('formMemoCategory').value.trim() || '일반';
        const pinned = document.getElementById('formMemoPinned').checked;
        const content = document.getElementById('formMemoContent').value;

        if (!title && !content) { showToast('제목이나 내용을 입력하세요.', 'error'); return; }
        const nowStr = new Date().toISOString().replace('T', ' ').slice(0, 19);

        if (id) {
          const idx = memos.findIndex(x => x.id === id);
          if (idx !== -1) memos[idx] = { ...memos[idx], title, category, pinned, content, updatedAt: nowStr };
        } else {
          memos.unshift({ id: 'memo-' + Date.now(), title, category, pinned, content, createdAt: nowStr, updatedAt: nowStr });
        }

        if (!categories.includes(category)) categories.push(category);
        await saveToCloud(); renderMemos();
        memoModal.classList.remove('active');
        showToast('저장되었습니다.', 'success');
      };

      document.getElementById('memoSearchInput').addEventListener('input', renderMemos);
      document.getElementById('filterCategory').addEventListener('change', renderMemos);

      initFirebase();
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initializeMemoApp); }
    else { initializeMemoApp(); }
  </script>
</body>
</html>
